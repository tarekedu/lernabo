<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>
<meta charset="UTF-8">
<title>Vorschau DE</title>
<link rel="stylesheet" href="fonts/inter.css">
<link rel="stylesheet" href="fonts/cairo.css">
<link rel="stylesheet" href="fonts/material-symbols.css">
<style>
:root{--ink:rgba(0,0,0,.95);--gray:#615d59;--gray-l:#a39e98;--warm:#f6f5f4;--blue:#0075de;--border:rgba(0,0,0,.1)}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1200px;height:630px;overflow:hidden;background:#fff;color:var(--ink);
 font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;position:relative}
.card{position:relative;z-index:2;padding:60px 72px 0}
.logo{display:flex;align-items:center;gap:14px;font-weight:700;font-size:31px;letter-spacing:-.5px}
.logo .mark{width:48px;height:48px;border-radius:11px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mi{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.logo .mi{font-size:27px}
h1{margin-top:56px;font-size:53px;line-height:1.15;letter-spacing:-1.2px;max-width:980px}
p.sub{margin-top:24px;font-size:26px;line-height:1.45;color:var(--gray);max-width:1010px}
.chips{margin-top:44px;display:flex;gap:14px}
.chip{border:1px solid var(--border);background:var(--warm);border-radius:999px;padding:13px 24px;font-size:20px;font-weight:600;color:#4a4642;display:flex;align-items:center;gap:11px;white-space:nowrap}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--blue);flex-shrink:0}
.domain{position:absolute;top:68px;inset-inline-end:72px;font-size:19px;color:var(--gray-l);z-index:2}
.wave{position:absolute;left:0;bottom:0;width:100%;height:74px;z-index:1}
.wave svg{display:block;width:100%;height:74px}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><span class="mark"><span class="mi">school</span></span>Lernbegleitung</div>
  <h1>Schritt für Schritt zu mehr Selbstvertrauen und besseren Noten</h1>
  <p class="sub">Jede Woche Aufgaben zum Schulthema, Korrektur in den nächsten Tagen und <span style="white-space:nowrap">2 Live-Stunden</span> pro Monat.</p>
  <div class="chips">
    <span class="chip"><span class="dot"></span>Mathe: alle Klassen</span>
    <span class="chip"><span class="dot"></span>Deutsch: bis Klasse 10</span>
    <span class="chip"><span class="dot"></span>Kiel und online</span>
  </div>
</div>
<div class="domain">lernbegleitung.app</div>
<div class="wave"><svg viewBox="0 0 1440 74" preserveAspectRatio="none">
  <path d="M-400 34 q 100 -24, 200 0 t 200 0 t 200 0 t 200 0 t 200 0 t 200 0 t 200 0 t 200 0 t 200 0 t 200 0 t 200 0 t 200 0" fill="none" stroke="#d7d5d1" stroke-width="1.5"/>
  <path d="M-400 56 q 100 -18, 200 0 t 200 0 t 200 0 t 200 0 t 200 0 t 200 0 t 200 0 t 200 0 t 200 0 t 200 0 t 200 0 t 200 0" fill="none" stroke="#e8e6e3" stroke-width="1.5"/>
</svg></div>
</body>
</html>
